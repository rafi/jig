# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/jig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    ldflags:
      - -s -w
      - -X github.com/rafi/jig/internal/version.version={{.Version}}
      - -X github.com/rafi/jig/internal/version.gitCommit={{.Commit}}
      - -X github.com/rafi/jig/internal/version.gitTreeState=clean
      - -X github.com/rafi/jig/internal/version.date={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}-{{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
